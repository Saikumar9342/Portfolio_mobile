name: atom_admin
description: "Atom Admin mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.0
  firebase_auth: ^4.19.0
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.0.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.2
  cloudinary_public: ^0.23.1
  image_picker: ^1.2.1
  syncfusion_flutter_pdf: ^24.1.41
  file_picker: ^8.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  local_auth: ^2.1.6
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.1.6
  flutter_svg: ^2.0.17
  url_launcher: ^6.2.5
  translator: ^1.0.4+1
  http: ^1.2.0
  flutter_app_badger: ^1.5.0
  audioplayers: ^5.2.1
  firebase_analytics: ^10.10.7
  firebase_crashlytics: ^3.4.19
  google_generative_ai: ^0.4.6
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand_logo.png
    - assets/images/brand_logo.svg
    - .env
